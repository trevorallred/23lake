name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: test "$(pnpm --version)" = 11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
